name: WH CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wh
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wh -d wh_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://wh:ci-only-password@localhost:5432/wh_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run migrate --workspace=@wh/api
      - run: npm test
      - run: npm run build
      - name: Docker configuration
        run: POSTGRES_PASSWORD=ci-only-password docker compose config --quiet
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t wh-api-ci .
      - name: Build website container
        run: docker build -f apps/web/Dockerfile -t wh-web-ci .
