name: WH Expo Store Build
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        type: choice
        options: [development, preview, production]
        default: preview
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: mobile-release
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '16.28.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Validate release configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(!process.env.EAS_PROJECT_ID || !process.env.EXPO_PUBLIC_API_URL?.startsWith('https://'))throw Error('Set EAS_PROJECT_ID and an HTTPS EXPO_PUBLIC_API_URL.');
          fs.writeFileSync('.env.local',['EAS_PROJECT_ID','EXPO_PUBLIC_API_URL'].map(n=>`${n}=${JSON.stringify(process.env[n])}`).join('\n'));
          JS
      - name: Build signed app with configured EAS credentials
        run: eas build --platform '${{ inputs.platform }}' --profile '${{ inputs.profile }}' --non-interactive --wait
