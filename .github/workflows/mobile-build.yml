name: WN Expo Mobile
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wh-expo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npm run export:android
      - run: npm run export:ios
